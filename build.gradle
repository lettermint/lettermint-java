import javax.inject.Inject

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'co.lettermint'
// The release workflow passes the version from the git tag: -PreleaseVersion=3.0.0.
version = providers.gradleProperty('releaseVersion').getOrElse('3.0.0-SNAPSHOT')

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // Generated types use Jackson annotations and TypeReference in their public API.
    api 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

// BuildInfo.VERSION (User-Agent) comes from the project version.
def buildInfoDir = layout.buildDirectory.dir('generated/sources/buildinfo/java/main')

def generateBuildInfo = tasks.register('generateBuildInfo') {
    def outputDir = buildInfoDir
    def sdkVersion = project.version.toString()
    inputs.property('version', sdkVersion)
    outputs.dir(outputDir)
    doLast {
        def file = outputDir.get().file('co/lettermint/BuildInfo.java').asFile
        file.parentFile.mkdirs()
        file.text = """package co.lettermint;

/** Build information, generated by Gradle. */
public final class BuildInfo {
    /** The SDK version. */
    public static final String VERSION = "${sdkVersion}";

    private BuildInfo() {
    }
}
"""
    }
}

sourceSets.main.java.srcDir(generateBuildInfo)

jar {
    manifest {
        attributes(
            'Implementation-Title': 'Lettermint Java SDK',
            'Implementation-Version': project.version,
            'Automatic-Module-Name': 'co.lettermint'
        )
    }
}

// src/main/java/co/lettermint/types is generated by the private lettermint/sdk-generator.
// Set LETTERMINT_SDK_GENERATOR to its checkout (default: ../sdk-generator).
//   ./gradlew generateTypes          regenerates the package
//   ./gradlew checkGeneratedTypes    verifies it (part of `check`). Without the generator,
//                                    as in CI, it only verifies the generated headers.
abstract class GeneratedTypesTask extends DefaultTask {
    @Inject
    abstract ExecOperations getExecOperations()

    @Internal
    abstract DirectoryProperty getTypesDir()

    @Internal
    abstract Property<String> getGenerator()

    @Internal
    abstract Property<Boolean> getCheckOnly()

    @TaskAction
    void run() {
        File generator = new File(getGenerator().get())
        File out = getTypesDir().get().asFile
        boolean available = new File(generator, 'lettermint_sdkgen').isDirectory() && new File(generator, 'spec.next.lock.json').isFile()
        if (available) {
            List<String> command = ['python3', '-m', 'lettermint_sdkgen', 'emit', 'java', '--profile', 'next', '--lock', 'spec.next.lock.json', '--out', out.absolutePath]
            if (getCheckOnly().get()) {
                command << '--check'
            }
            getExecOperations().exec {
                workingDir generator
                commandLine command
            }
            return
        }
        if (!getCheckOnly().get()) {
            throw new GradleException("The SDK generator was not found at ${generator}. Set LETTERMINT_SDK_GENERATOR to its checkout.")
        }
        String first = null
        File[] files = out.listFiles({ File f -> f.name.endsWith('.java') } as FileFilter)
        if (files == null || files.length == 0) {
            throw new GradleException("${out} has no generated sources.")
        }
        for (File file : files.sort { it.name }) {
            List<String> lines = file.readLines('UTF-8')
            String head = lines.take(5).join('\n')
            boolean valid = lines.size() > 5 &&
                lines[0] == '// Generated by lettermint/sdk-generator — do not edit.' &&
                lines[1] ==~ /\/\/ Spec: lettermint\/lettermint@[0-9a-f]{40}( \(.+\))?/ &&
                lines[2] ==~ /\/\/ sending-openapi\.json SHA-256: [0-9a-f]{64}/ &&
                lines[3] ==~ /\/\/ team-openapi\.json SHA-256: [0-9a-f]{64}/ &&
                lines[4] == '// Naming profile: next'
            if (!valid) {
                throw new GradleException("${file} is missing the generator header. Regenerate it; do not edit it by hand.")
            }
            if (first == null) {
                first = head
            } else if (first != head) {
                throw new GradleException("${file.name} comes from a different spec than the other generated files. Regenerate the package.")
            }
        }
        logger.lifecycle("SDK generator not found at ${generator}; checked the headers of ${files.length} generated files only.")
        logger.lifecycle(first.split('\n')[1])
    }
}

def generatorPath = providers.environmentVariable('LETTERMINT_SDK_GENERATOR')
    .orElse(layout.projectDirectory.dir('../sdk-generator').asFile.absolutePath)

tasks.register('generateTypes', GeneratedTypesTask) {
    group = 'build'
    description = 'Regenerates src/main/java/co/lettermint/types with the SDK generator.'
    typesDir = layout.projectDirectory.dir('src/main/java/co/lettermint/types')
    generator = generatorPath
    checkOnly = false
}

def checkGeneratedTypes = tasks.register('checkGeneratedTypes', GeneratedTypesTask) {
    group = 'verification'
    description = 'Verifies src/main/java/co/lettermint/types against the SDK generator, or its headers without it.'
    typesDir = layout.projectDirectory.dir('src/main/java/co/lettermint/types')
    generator = generatorPath
    checkOnly = true
}

tasks.named('check') {
    dependsOn checkGeneratedTypes
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'Lettermint Java SDK'
                description = 'Official Java SDK for the Lettermint API'
                url = 'https://github.com/lettermint/lettermint-java'

                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }

                developers {
                    developer {
                        name = 'Lettermint'
                        email = 'support@lettermint.co'
                        organization = 'Lettermint'
                        organizationUrl = 'https://lettermint.co'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/lettermint/lettermint-java.git'
                    developerConnection = 'scm:git:ssh://github.com:lettermint/lettermint-java.git'
                    url = 'https://github.com/lettermint/lettermint-java/tree/main'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'sonatypeCentral'
            url = uri('https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
            credentials {
                username = System.getenv('OSSRH_USERNAME') ?: ''
                password = System.getenv('OSSRH_PASSWORD') ?: ''
            }
        }
    }
}

// Never publish the -SNAPSHOT placeholder: releases must pass -PreleaseVersion.
def publishedVersion = project.version.toString()
tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        if (publishedVersion.endsWith('-SNAPSHOT')) {
            throw new GradleException("Refusing to publish ${publishedVersion}; pass -PreleaseVersion=<version from the release tag>.")
        }
    }
}

signing {
    // Uses ORG_GRADLE_PROJECT_signingKey, signingKeyId, signingPassword from env
    def signingKey = findProperty('signingKey')
    def signingKeyId = findProperty('signingKeyId')
    def signingPassword = findProperty('signingPassword') ?: ''

    if (signingKey) {
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
    }

    sign publishing.publications.maven
}

tasks.withType(Sign) {
    onlyIf { findProperty('signingKey') != null }
}
